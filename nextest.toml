[test-groups]
slow = { max-threads = "num-cpus" }
conformance = { max-threads = "num-cpus" }

[profile.default]
default-filter = 'not test(/(.*_slow_$|.*_conformance_$)/)'

[profile.slow]
default-filter = 'test(/.*_slow_$/)'

[profile.conformance]
default-filter = 'test(/.*_conformance_$/)'

[profile.all]
default-filter = 'test(/.*/)'

# Tests that run AVX-512 code paths. CI runs them under Intel SDE.
[profile.avx512]
default-filter = '(package(commonware-cryptography-curve25519) | (package(commonware-cryptography) & test(/^(reed_solomon|sha256)::/)) | (package(commonware-coding) & test(/reed_solomon/))) & not test(/(.*_slow_$|.*_conformance_$)/)'
