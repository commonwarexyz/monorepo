[package]
name = "commonware-allocator"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Allocate and manage memory."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/allocator"
documentation = "https://docs.rs/commonware-allocator"
links = "mimalloc"
build = "build.rs"

[lints]
workspace = true

[dependencies]
commonware-macros = { workspace = true, features = ["std"] }
libc = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[features]
default = [ "mimalloc" ]
mimalloc = [ "dep:libc" ]
# Raise the largest allocation served from a thread-local page (512 KiB by
# default). This scales every mimalloc page, and with it the memory each size
# class holds per thread. Only binaries should enable one, and the largest
# enabled feature wins. See the page geometry section of the `mimalloc`
# module docs.
large-objects-1m = []
large-objects-2m = []
large-objects-4m = []
