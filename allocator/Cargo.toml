[package]
name = "commonware-allocator"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Configure and observe the global allocator."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/allocator"
links = "mimalloc"
build = "build.rs"

[lints]
workspace = true

[dependencies]
commonware-macros = { workspace = true, features = ["std"] }
libc = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[features]
default = [ "mimalloc" ]
mimalloc = [ "dep:libc" ]
# Largest allocation served from a thread-local page (512 KiB by default).
# Larger objects get a page of their own, which costs an arena operation per
# allocation and free (hundreds of nanoseconds, microseconds under
# contention) instead of a free-list pop. Each feature raises the limit by
# building mimalloc with a larger arena slice (the limit is eight slices),
# which also makes every page, and so the minimum memory held per size
# class and thread, proportionally larger: 2, 4, or 8 times the default
# (arena chunks and the alignment slack of a pinned reservation scale the
# same way). Only binaries should enable one; when several are enabled, the
# largest wins. 4 MiB is the most the vendored mimalloc supports: its
# size-class table ends there and per-page block counts are 16-bit. See
# `mimalloc::LARGE_OBJECT_LIMIT`.
large-objects-1m = []
large-objects-2m = []
large-objects-4m = []
