[package]
name = "commonware-allocator"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Allocate and manage memory."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/allocator"
documentation = "https://docs.rs/commonware-allocator"
links = "mimalloc"
build = "build.rs"

[lints]
workspace = true

[dependencies]
commonware-macros = { workspace = true, features = ["std"] }
libc = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[features]
default = [ "mimalloc" ]
mimalloc = [ "dep:libc" ]
# Raise the largest allocation served from a thread-local page (512 KiB by
# default) by scaling mimalloc's arena slice, which also scales every page
# and so the memory each size class holds per thread. Only binaries should
# enable one; the largest enabled wins, and 4 MiB is the most the vendored
# mimalloc supports. See the page geometry section of the `mimalloc` module
# docs for the cost above the limit.
large-objects-1m = []
large-objects-2m = []
large-objects-4m = []
