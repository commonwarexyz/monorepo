[package]
name = "commonware-webrtc"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Carry Commonware byte streams over browser WebRTC data channels."
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/webrtc"
documentation = "https://docs.rs/commonware-webrtc"

[lints]
workspace = true

[dependencies]
bytes.workspace = true
commonware-macros.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
commonware-runtime = { workspace = true, features = ["web"] }
futures.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
	"Event",
	"MessageEvent",
	"RtcDataChannel",
	"RtcDataChannelState",
	"RtcDataChannelType",
	"RtcPeerConnection",
	"RtcPeerConnectionState",
	"Window",
] }

[lib]
bench = false
