[package]
name = "commonware-runtime-fuzz"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata]
cargo-fuzz = true

[lints.cargo]
unused_dependencies = "allow"

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
bytes = { workspace = true, features = ["std"] }
commonware-codec.workspace = true
commonware-cryptography.workspace = true
commonware-runtime = { workspace = true, features = ["test-utils"] }
commonware-utils = { workspace = true, features = ["arbitrary"] }
futures.workspace = true
libfuzzer-sys.workspace = true
rand.workspace = true

[features]
default = []
storage-differential = []
storage-faults = []
shared-reads = []
iobuf = []
runtime-all = [
	"iobuf",
	"shared-reads",
	"storage-differential",
	"storage-faults",
]

[lib]
bench = false

[[bin]]
name = "buffer"
path = "fuzz_targets/buffer.rs"
test = false
doc = false

[[bin]]
name = "blob_integrity"
path = "fuzz_targets/blob_integrity.rs"
test = false
doc = false

[[bin]]
name = "blob_creation"
path = "fuzz_targets/blob_creation.rs"
test = false
doc = false

[[bin]]
name = "storage_differential"
path = "fuzz_targets/storage_differential.rs"
required-features = ["storage-differential"]
test = false
doc = false

[[bin]]
name = "storage_faults"
path = "fuzz_targets/storage_faults.rs"
required-features = ["storage-faults"]
test = false
doc = false
bench = false

[[bin]]
name = "shared_reads"
path = "fuzz_targets/shared_reads.rs"
required-features = ["shared-reads"]
test = false
doc = false
bench = false

[[bin]]
name = "iobuf"
path = "fuzz_targets/iobuf.rs"
required-features = ["iobuf"]
test = false
doc = false
