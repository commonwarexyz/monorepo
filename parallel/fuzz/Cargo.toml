[package]
name = "commonware-parallel-fuzz"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata]
cargo-fuzz = true

[lints.cargo]
unused_dependencies = "allow"

[dependencies]
arbitrary.workspace = true
commonware-parallel = { workspace = true, features = ["fuzz", "test-utils"] }
commonware-utils = { workspace = true, features = ["arbitrary", "std"] }
libfuzzer-sys.workspace = true
rand_core.workspace = true

[[bin]]
name = "parallel"
path = "fuzz_targets/parallel.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parallel_sort"
path = "fuzz_targets/parallel_sort.rs"
test = false
doc = false
bench = false
