[package]
name = "commonware-parallel"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Parallelize fold operations with pluggable execution strategies."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/parallel"

[lints]
workspace = true

[dependencies]
cfg-if.workspace = true
commonware-macros.workspace = true
crossbeam-deque = { workspace = true, optional = true }
crossbeam-utils = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
commonware-utils = { workspace = true, features = ["std"] }
crossbeam-deque.workspace = true
crossbeam-utils.workspace = true
dashmap.workspace = true
futures.workspace = true
proptest.workspace = true
rand.workspace = true

[features]
default = [ "std" ]
std = [
	"commonware-macros/std",
	"dep:crossbeam-deque",
	"dep:crossbeam-utils",
	"dep:dashmap",
	"dep:futures",
]
test-utils = [ "std" ]
