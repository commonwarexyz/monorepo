[package]
name = "commonware-collector"
edition.workspace = true
rust-version.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Collect responses to committable requests."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/collector"
documentation = "https://docs.rs/commonware-collector"

[lints]
workspace = true

[dependencies]
ahash = { workspace = true, features = ["std", "runtime-rng"] }
arbitrary = { workspace = true, optional = true }
commonware-actor.workspace = true
commonware-codec.workspace = true
commonware-cryptography.workspace = true
commonware-macros = { workspace = true, features = ["std"] }
commonware-p2p.workspace = true
commonware-runtime.workspace = true
commonware-utils.workspace = true
tracing.workspace = true

[dev-dependencies]
commonware-conformance.workspace = true
commonware-p2p = { workspace = true, features = ["mocks"] }
commonware-runtime = { workspace = true, features = ["test-utils"] }
rstest.workspace = true
tracing-subscriber.workspace = true

[lib]
bench = false

[features]
arbitrary = [
	"commonware-codec/arbitrary",
	"commonware-cryptography/arbitrary",
	"commonware-p2p/arbitrary",
	"commonware-runtime/arbitrary",
	"commonware-utils/arbitrary",
	"dep:arbitrary",
]
