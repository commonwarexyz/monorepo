[package]
name = "commonware-consensus-fuzz-structures"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = [ "mocks" ]
mocks = [ "commonware-consensus/mocks", "commonware-cryptography/mocks" ]

[package.metadata]
cargo-fuzz = true

[lints.cargo]
unused_dependencies = "allow"

# `cargo fuzz` sets `--cfg fuzzing`; declare it so non-fuzz builds don't warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
commonware-actor.workspace = true
commonware-codec.workspace = true
commonware-coding.workspace = true
commonware-consensus = { workspace = true, features = ["mocks", "arbitrary"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
commonware-math.workspace = true
commonware-parallel.workspace = true
commonware-runtime = { workspace = true, features = ["test-utils"] }
commonware-utils = { workspace = true, features = ["arbitrary"] }
libfuzzer-sys.workspace = true
rand_core.workspace = true

[[bin]]
name = "exp_simplex_messages"
path = "fuzz_targets/exp_simplex_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exp_simplex_reporter_filtering"
path = "fuzz_targets/exp_simplex_reporter_filtering.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exp_simplex_threshold_vrf"
path = "fuzz_targets/exp_simplex_threshold_vrf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exp_automaton_defaults"
path = "fuzz_targets/exp_automaton_defaults.rs"
test = false
doc = false
bench = false

[[bin]]
name = "exp_marshal_coding_types"
path = "fuzz_targets/exp_marshal_coding_types.rs"
test = false
doc = false
bench = false
