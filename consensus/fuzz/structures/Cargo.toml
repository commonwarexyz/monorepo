[package]
name = "commonware-consensus-fuzz-structures"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[features]
default = [ "mocks" ]
mocks = [ "commonware-consensus/mocks", "commonware-cryptography/mocks" ]

[package.metadata]
cargo-fuzz = true

# `cargo fuzz` sets `--cfg fuzzing`; declare it so non-fuzz builds don't warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
commonware-actor.workspace = true
commonware-codec.workspace = true
commonware-coding.workspace = true
commonware-consensus = { workspace = true, features = ["mocks", "arbitrary"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
commonware-math.workspace = true
commonware-parallel.workspace = true
commonware-utils = { workspace = true, features = ["arbitrary"] }
libfuzzer-sys.workspace = true

[[bin]]
name = "attributable_map"
path = "fuzz_targets/attributable_map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "simplex_elector"
path = "fuzz_targets/simplex_elector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "simplex_messages"
path = "fuzz_targets/simplex_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "simplex_reporter_filtering"
path = "fuzz_targets/simplex_reporter_filtering.rs"
test = false
doc = false
bench = false
