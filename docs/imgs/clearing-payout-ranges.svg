<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title description">
  <title id="title">Claiming a payout exactly once</title>
  <desc id="description">A four-step example starts with the end-exclusive unclaimed interval 10 through 15. Claiming interior payout 12 splits it into 10 through 12 and 13 through 15. Claiming edge payouts 10 and 14 shrinks those ranges to the singleton intervals 11 through 12 and 13 through 14. Claiming 11 and 13 deletes the last two ranges. Replaying payout 12 is rejected because its index is no longer in an unclaimed interval, even though output 12 and its opening still authenticate against the unchanged current finalized payout root. Each successful claim atomically consumes the interval position, reduces the reserve, and pays the destination. No MMR leaf is deleted and no claimed-index set is stored.</desc>
  <rect width="1320" height="760" fill="#fff"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #111; }
    .heading { font-size: 21px; font-weight: 700; fill: #111; }
    .label { font-size: 18px; fill: #333; }
    .note { font-size: 16px; fill: #666; }
    .mono { font-size: 20px; fill: #111; }
    .center { text-anchor: middle; }
    .right { text-anchor: end; }
    .blue { fill: #2424d4; }
    .green { fill: #14733b; }
    .red { fill: #b42318; }
    .panel { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1.5; }
    .record { fill: #fff; stroke: #bcbcbc; stroke-width: 1.5; }
    .selected { fill: #f4f4ff; stroke: #2424d4; stroke-width: 1.5; }
    .accepted { fill: #f1fbf5; stroke: #46a36d; stroke-width: 1.5; }
    .rejected { fill: #fff4f2; stroke: #d92d20; stroke-width: 1.5; }
    .link { fill: none; stroke: #999; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #2424d4; stroke-width: 2; marker-end: url(#arrow); }
    .rule { stroke: #dedede; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2424d4"/>
    </marker>
  </defs>

  <text class="title" x="30" y="40">Claiming a Payout Exactly Once</text>
  <text class="note" x="30" y="69">The MMR proves the output exists; the interval map proves it is still unclaimed.</text>

  <rect class="selected" x="30" y="96" width="1260" height="104" rx="5"/>
  <text class="heading blue" x="58" y="130">Same current finalized payout root throughout this example</text>
  <rect class="record" x="58" y="148" width="250" height="34" rx="3"/>
  <text class="label center" x="183" y="171">Payout MMR root P</text>
  <path class="arrow" d="M328 165 H411"/>
  <rect class="record" x="432" y="148" width="284" height="34" rx="3"/>
  <text class="label center" x="574" y="171">output 12 + opening</text>
  <path class="arrow" d="M736 165 H819"/>
  <rect class="accepted" x="840" y="148" width="422" height="34" rx="3"/>
  <text class="label center green" x="1051" y="171">valid membership · leaf retained</text>

  <rect class="panel" x="30" y="226" width="615" height="222" rx="5"/>
  <text class="heading" x="56" y="262">1 · Finalized outputs become claimable</text>
  <text class="note" x="56" y="291">UNCLAIMED</text>
  <rect class="selected" x="56" y="309" width="190" height="43" rx="4"/>
  <text class="mono center blue" x="151" y="337">[10,15)</text>
  <text class="label" x="270" y="337">contains 10, 11, 12, 13, 14</text>
  <path class="rule" d="M56 375 H619"/>
  <text class="note" x="56" y="404">Ranges are end-exclusive. The map stores only</text>
  <text class="note" x="56" y="429">start 10 → end 15.</text>

  <rect class="panel" x="675" y="226" width="615" height="222" rx="5"/>
  <text class="heading" x="701" y="262">2 · Claim interior index 12</text>
  <rect class="selected" x="701" y="309" width="170" height="43" rx="4"/>
  <text class="mono center blue" x="786" y="337">[10,12)</text>
  <text class="mono center" x="981" y="337">12 consumed</text>
  <rect class="selected" x="1095" y="309" width="169" height="43" rx="4"/>
  <text class="mono center blue" x="1179" y="337">[13,15)</text>
  <path class="rule" d="M701 375 H1264"/>
  <rect class="accepted" x="701" y="392" width="563" height="38" rx="4"/>
  <text class="label center green" x="982" y="417">one atomic claim · split · reduce reserve · pay</text>

  <path class="arrow" d="M645 337 H665"/>
  <path class="arrow" d="M982 448 V468 H338 V478"/>

  <rect class="panel" x="30" y="488" width="615" height="222" rx="5"/>
  <text class="heading" x="56" y="524">3 · Claim edge indices 10 and 14</text>
  <text class="note" x="56" y="553">Each edge claim shrinks its containing range.</text>
  <rect class="selected" x="56" y="579" width="170" height="43" rx="4"/>
  <text class="mono center blue" x="141" y="607">[11,12)</text>
  <text class="mono center" x="338" y="607">10 and 14 paid</text>
  <rect class="selected" x="449" y="579" width="170" height="43" rx="4"/>
  <text class="mono center blue" x="534" y="607">[13,14)</text>
  <path class="rule" d="M56 645 H619"/>
  <text class="note" x="56" y="678">Only the two singleton ranges remain.</text>

  <path class="arrow" d="M645 599 H665"/>

  <rect class="panel" x="675" y="488" width="615" height="222" rx="5"/>
  <text class="heading" x="701" y="524">4 · Delete singletons; reject replay</text>
  <text class="label" x="701" y="560">claim 11 + claim 13</text>
  <path class="arrow" d="M917 554 H1000"/>
  <text class="label green" x="1021" y="560">no ranges remain</text>
  <rect class="rejected" x="701" y="583" width="563" height="70" rx="4"/>
  <text class="label red" x="721" y="611">replay output 12 + the same valid MMR opening</text>
  <text class="label red" x="721" y="638">REJECT · index 12 is in no unclaimed interval</text>
  <text class="note" x="701" y="682">No claimed set is added; no MMR leaf is deleted.</text>
</svg>
