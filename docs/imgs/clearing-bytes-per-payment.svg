<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470" role="img" aria-labelledby="title description">
  <title id="title">The Vanishing Cost of a Payment: Keyed Updates</title>
  <desc id="description">Logarithmic plots model unit payments between fixed cyclic account pairs, with one recipient per sender. The left panel uses full 32-byte account keys and includes sequence, cumulative amount, and payment-count varint widths. At one million payments the updates are 108,499 bytes for 1,024 accounts, 1,029,955 bytes for 10,000 accounts, 10,383,572 bytes for 100,000 accounts, 103,983,572 bytes for 1,000,000 accounts. Each validator receives the complete update. The right panel divides the 101-byte commitment and certificate for 100 validators by payment count.</desc>
