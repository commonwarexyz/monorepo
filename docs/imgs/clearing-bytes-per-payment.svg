<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470">
  <rect width="1320" height="470" fill="#fff"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #111; }
    .panel-title { font-size: 20px; font-weight: 700; fill: #111; text-anchor: middle; }
    .axis { font-size: 15px; fill: #666; }
    .axis-strong { font-size: 16px; font-weight: 700; fill: #111; }
    .value { font-size: 15px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .grid { stroke: #dedede; stroke-width: 1; }
    .frame { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1.5; }
    .blue { stroke: #2424d4; fill: none; }
    .green { stroke: #2f7d3d; fill: none; }
    .blue-text { fill: #2424d4; }
    .green-text { fill: #2f7d3d; }
    .series { stroke-width: 3; }
    .dashed { stroke-dasharray: 8 6; }
  </style>

  <text class="title" x="34" y="39">The Vanishing Cost of a Payment</text>

  <line class="blue series" x1="720" y1="26" x2="760" y2="26"/>
  <circle cx="740" cy="26" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <text class="axis-strong blue-text" x="770" y="31">A = 1,024 • h = 1</text>
  <line class="green series" x1="1000" y1="26" x2="1040" y2="26"/>
  <rect x="1015" y="21" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <text class="axis-strong green-text" x="1050" y="31">A = 1,000,000 • h = 1</text>
  <line class="blue series dashed" x1="720" y1="50" x2="760" y2="50"/>
  <text class="axis-strong blue-text" x="770" y="55">A = 1,024 • h = 512</text>
  <line class="green series dashed" x1="1000" y1="50" x2="1040" y2="50"/>
  <text class="axis-strong green-text" x="1050" y="55">A = 1,000,000 • h = 512</text>

  <!-- Offchain public corpus. -->
  <rect class="frame" x="30" y="90" width="610" height="360" rx="3"/>
  <text class="panel-title" x="335" y="122">Public Corpus (Offchain)</text>
  <text class="axis" x="95" y="138" text-anchor="end">bytes</text>
  <line class="grid" x1="105" y1="150" x2="620" y2="150"/>
  <line class="grid" x1="105" y1="186.67" x2="620" y2="186.67"/>
  <line class="grid" x1="105" y1="223.33" x2="620" y2="223.33"/>
  <line class="grid" x1="105" y1="260" x2="620" y2="260"/>
  <line class="grid" x1="105" y1="296.67" x2="620" y2="296.67"/>
  <line class="grid" x1="105" y1="333.33" x2="620" y2="333.33"/>
  <line class="grid" x1="105" y1="370" x2="620" y2="370"/>
  <line class="grid" x1="150" y1="150" x2="150" y2="370"/>
  <line class="grid" x1="300" y1="150" x2="300" y2="370"/>
  <line class="grid" x1="450" y1="150" x2="450" y2="370"/>
  <line class="grid" x1="600" y1="150" x2="600" y2="370"/>
  <text class="axis" x="95" y="155" text-anchor="end">1,000</text>
  <text class="axis" x="95" y="192" text-anchor="end">100</text>
  <text class="axis" x="95" y="228" text-anchor="end">10</text>
  <text class="axis" x="95" y="265" text-anchor="end">1</text>
  <text class="axis" x="95" y="302" text-anchor="end">0.1</text>
  <text class="axis" x="95" y="338" text-anchor="end">0.01</text>
  <text class="axis" x="95" y="375" text-anchor="end">0.001</text>
  <text class="axis-strong" x="150" y="402" text-anchor="middle">1M</text>
  <text class="axis-strong" x="300" y="402" text-anchor="middle">10M</text>
  <text class="axis-strong" x="450" y="402" text-anchor="middle">100M</text>
  <text class="axis-strong" x="600" y="402" text-anchor="middle">1B</text>
  <text class="axis" x="360" y="428" text-anchor="middle">payments accepted (T)</text>

  <path class="green series" d="M150 156.88 L300 193.55 L450 230.22 L600 266.88"/>
  <path class="green series dashed" d="M150 154.29 L300 190.95 L450 227.62 L600 264.29"/>
  <path class="blue series" d="M150 248.41 L300 285.08 L450 321.75 L600 358.41"/>
  <path class="blue series dashed" d="M150 184.17 L300 220.83 L450 257.50 L600 294.17"/>
  <circle cx="150" cy="248.41" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="300" cy="285.08" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="450" cy="321.75" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="600" cy="358.41" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <rect x="145" y="151.88" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="295" y="188.55" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="445" y="225.22" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="595" y="261.88" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <text class="value green-text" x="162" y="143">764</text>
  <text class="value green-text" x="162" y="175">649</text>
  <text class="value blue-text" x="162" y="205">117</text>
  <text class="value blue-text" x="162" y="236">2.07</text>
  <text class="value green-text" x="588" y="255" text-anchor="end">0.76</text>
  <text class="value green-text" x="588" y="283" text-anchor="end">0.65</text>
  <text class="value blue-text" x="588" y="312" text-anchor="end">0.12</text>
  <text class="value blue-text" x="588" y="347" text-anchor="end">0.002</text>

  <!-- Onchain commitment. -->
  <rect class="frame" x="670" y="90" width="620" height="360" rx="3"/>
  <text class="panel-title" x="980" y="122">Commitment (Onchain)</text>
  <text class="axis" x="760" y="138" text-anchor="end">bytes</text>
  <line class="grid" x1="770" y1="150" x2="1255" y2="150"/>
  <line class="grid" x1="770" y1="205" x2="1255" y2="205"/>
  <line class="grid" x1="770" y1="260" x2="1255" y2="260"/>
  <line class="grid" x1="770" y1="315" x2="1255" y2="315"/>
  <line class="grid" x1="770" y1="370" x2="1255" y2="370"/>
  <line class="grid" x1="790" y1="150" x2="790" y2="370"/>
  <line class="grid" x1="940" y1="150" x2="940" y2="370"/>
  <line class="grid" x1="1090" y1="150" x2="1090" y2="370"/>
  <line class="grid" x1="1240" y1="150" x2="1240" y2="370"/>
  <text class="axis" x="760" y="155" text-anchor="end">0.01</text>
  <text class="axis" x="760" y="210" text-anchor="end">0.001</text>
  <text class="axis" x="760" y="265" text-anchor="end">0.0001</text>
  <text class="axis" x="760" y="320" text-anchor="end">0.00001</text>
  <text class="axis" x="760" y="375" text-anchor="end">0.000001</text>
  <text class="axis-strong" x="790" y="402" text-anchor="middle">1M</text>
  <text class="axis-strong" x="940" y="402" text-anchor="middle">10M</text>
  <text class="axis-strong" x="1090" y="402" text-anchor="middle">100M</text>
  <text class="axis-strong" x="1240" y="402" text-anchor="middle">1B</text>
  <text class="axis" x="1000" y="428" text-anchor="middle">payments accepted (T)</text>

  <path class="green series" d="M790 162.44 L940 217.44 L1090 272.44 L1240 327.44"/>
  <path class="blue series" d="M790 163.76 L940 218.76 L1090 273.76 L1240 328.76"/>
  <rect x="785" y="157.44" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="935" y="212.44" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="1085" y="267.44" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="1235" y="322.44" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <circle cx="790" cy="163.76" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="940" cy="218.76" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="1090" cy="273.76" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="1240" cy="328.76" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <text class="value green-text" x="802" y="151">0.00594</text>
  <text class="value blue-text" x="802" y="184">0.00562</text>
  <text class="value green-text" x="1228" y="316" text-anchor="end">0.00000594</text>
  <text class="value blue-text" x="1228" y="348" text-anchor="end">0.00000562</text>
</svg>
