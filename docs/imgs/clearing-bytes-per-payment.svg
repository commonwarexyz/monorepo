<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 470">
  <rect width="1320" height="470" fill="#fff"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #111; }
    .panel-title { font-size: 20px; font-weight: 700; fill: #111; text-anchor: middle; }
    .axis { font-size: 15px; fill: #666; }
    .axis-strong { font-size: 16px; font-weight: 700; fill: #111; }
    .value { font-size: 15px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .grid { stroke: #dedede; stroke-width: 1; }
    .frame { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1.5; }
    .blue { stroke: #2424d4; fill: none; }
    .green { stroke: #2f7d3d; fill: none; }
    .neutral { stroke: #555; fill: none; }
    .blue-text { fill: #2424d4; }
    .green-text { fill: #2f7d3d; }
    .neutral-text { fill: #555; }
    .series { stroke-width: 3; }
    .dashed { stroke-dasharray: 8 6; }
  </style>

  <text class="title" x="34" y="39">The Vanishing Cost of a Payment</text>

  <line class="blue series" x1="720" y1="26" x2="760" y2="26"/>
  <circle cx="740" cy="26" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <text class="axis-strong blue-text" x="770" y="31">A = 1,024 • h = 1</text>
  <line class="green series" x1="1000" y1="26" x2="1040" y2="26"/>
  <rect x="1015" y="21" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <text class="axis-strong green-text" x="1050" y="31">A = 1,000,000 • h = 1</text>
  <line class="blue series dashed" x1="720" y1="50" x2="760" y2="50"/>
  <text class="axis-strong blue-text" x="770" y="55">A = 1,024 • h = 512</text>
  <line class="green series dashed" x1="1000" y1="50" x2="1040" y2="50"/>
  <text class="axis-strong green-text" x="1050" y="55">A = 1,000,000 • h = 512</text>

