<svg xmlns="http://www.w3.org/2000/svg" width="640" height="384" viewBox="0 36 640 384" role="img" aria-labelledby="title">
  <title id="title">A leader proposal references one tip per producer chain</title>
  <rect y="36" width="640" height="384" fill="#fff"/>
  <style>
    text { font-family: monospace; font-size: 15px; }
    .chain { font-size: 16px; font-weight: 600; text-anchor: end; }
    .note { fill: #666666; }
