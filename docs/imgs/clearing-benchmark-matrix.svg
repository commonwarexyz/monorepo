  <text class="axis" x="95" y="243" text-anchor="end">100</text>
  <text class="axis" x="95" y="287" text-anchor="end">10</text>
  <text class="axis" x="95" y="331" text-anchor="end">1</text>
  <text class="axis" x="95" y="375" text-anchor="end">0.1</text>
  <text class="axis-strong" x="120" y="402" text-anchor="middle">1k</text>
  <text class="axis-strong" x="205" y="402" text-anchor="middle">10k</text>
  <text class="axis-strong" x="290" y="402" text-anchor="middle">100k</text>
  <text class="axis-strong" x="380" y="402" text-anchor="middle">1M</text>
