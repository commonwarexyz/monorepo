  <text class="value deal-text" x="728" y="304">1.81</text>
  <text class="value deal-text" x="802" y="254" text-anchor="end">24.9</text>

  <rect class="frame" x="890" y="90" width="400" height="360" rx="3"/>
  <text class="panel-title" x="1090" y="122">Validator: Seal</text>
  <text class="axis" x="955" y="138" text-anchor="end">ms</text>
  <line class="grid" x1="965" y1="150" x2="1255" y2="150"/>
  <line class="grid" x1="965" y1="194" x2="1255" y2="194"/>
  <line class="grid" x1="965" y1="238" x2="1255" y2="238"/>
  <line class="grid" x1="965" y1="282" x2="1255" y2="282"/>
