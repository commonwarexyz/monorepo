  <circle cx="1020" cy="369.67" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="1200" cy="336.62" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <rect x="1015" y="199.55" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="1195" y="175.82" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <text class="value blue-text" x="1032" y="357">2.12</text>
  <text class="value blue-text" x="1210" y="325">212</text>
  <text class="value green-text" x="1032" y="192">1,053</text>
  <text class="value green-text" x="1210" y="169">1,204</text>
