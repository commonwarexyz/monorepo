  <path class="prepare series" d="M120 342.5 L205 312.5 L290 267.6 L380 223.4"/>
  <circle cx="120" cy="342.5" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="205" cy="312.5" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="290" cy="267.6" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
