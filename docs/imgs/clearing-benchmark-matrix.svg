  <circle cx="1065" cy="275.2" r="5" fill="#fff" stroke="#d9251c" stroke-width="3"/>
  <circle cx="1150" cy="233.5" r="5" fill="#fff" stroke="#d9251c" stroke-width="3"/>
  <circle cx="1240" cy="189.2" r="5" fill="#fff" stroke="#d9251c" stroke-width="3"/>
  <text class="value seal-text" x="988" y="296">2.62</text>
