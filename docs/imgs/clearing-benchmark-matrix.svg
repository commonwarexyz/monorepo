  <path class="prepare series" d="M120 308.5 L205 271.8 L290 227.0 L380 182.9"/>
  <circle cx="120" cy="308.5" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="205" cy="271.8" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="290" cy="227.0" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
