  <text class="value prepare-text" x="128" y="331">0.422</text>
  <text class="value prepare-text" x="213" y="302">2.03</text>
  <text class="value prepare-text" x="298" y="257">21.2</text>
  <text class="value prepare-text" x="372" y="212" text-anchor="end">215</text>

