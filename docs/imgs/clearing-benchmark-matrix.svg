  <rect x="155" y="222.97" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="335" y="168.88" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
