    <path d="M770 181.56 V186.58 M764 181.56 H776 M764 186.58 H776"/>
  </g>
  <circle cx="590" cy="369.50" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <circle cx="770" cy="352.73" r="5" fill="#fff" stroke="#2424d4" stroke-width="3"/>
  <rect x="585" y="203.84" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <rect x="765" y="178.98" width="10" height="10" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <text class="value blue-text" x="602" y="357">1.13</text>
  <text class="value blue-text" x="780" y="341">39.3</text>
  <text class="value green-text" x="602" y="197">366</text>
  <text class="value green-text" x="780" y="172">423</text>

  <!-- Maximum-load validator. -->
  <rect class="frame" x="890" y="90" width="400" height="360" rx="3"/>
