  <text class="axis" x="525" y="210" text-anchor="end">375</text>
  <text class="axis" x="525" y="265" text-anchor="end">250</text>
  <text class="axis" x="525" y="320" text-anchor="end">125</text>
  <text class="axis" x="525" y="375" text-anchor="end">0</text>
