  <circle cx="635" cy="347.9" r="5" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <circle cx="720" cy="314.7" r="5" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <circle cx="810" cy="264.5" r="5" fill="#fff" stroke="#2f7d3d" stroke-width="3"/>
  <text class="value deal-text" x="558" y="349">0.164</text>
