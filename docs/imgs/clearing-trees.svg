<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 844" role="img" aria-labelledby="title description">
  <title id="title">The Commitments Behind a Close</title>
  <desc id="description">Each validator derives three shared protocol roots: state, activity, and payout. After prior activity operations, this epoch appends a sorted Row for accounts a, b, c, and d. Each Row directly holds the account, final debit, sequence, and outgoing-payment BMT root; the certified row count delimits that prefix. Original Entry records follow in payer-row order, and Commit(None) ends the epoch. The entries for c pay 4 to b and 7 to d; their positive values sum to c's debit of 11 and reconstruct the BMT root that c signs. QMDB carries positive balances of a: 85, b: 58, c: 26, and d: 31 into the next epoch. After prior payout operations, this epoch appends no payout outputs and adds Commit(None). A payout output stores destination and amount and is addressed by its native append location. A separate private QMDB keeps each validator's signing decisions local.</desc>
  <rect width="1320" height="844" fill="#fff"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #111; }
    .heading { font-size: 22px; font-weight: 700; fill: #111; }
    .label { font-size: 19px; fill: #333; }
    .note { font-size: 17px; fill: #666; }
    .mono { font-size: 21px; fill: #111; }
    .center { text-anchor: middle; }
    .right { text-anchor: end; }
    .blue { fill: #2424d4; }
    .panel { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1.5; }
    .record { fill: #fff; stroke: #bcbcbc; stroke-width: 1.5; }
    .selected { fill: #f4f4ff; stroke: #2424d4; stroke-width: 1.5; }
    .link { fill: none; stroke: #999; stroke-width: 1.5; }
    .focus { fill: none; stroke: #2424d4; stroke-width: 2; }
    .rule { stroke: #dedede; stroke-width: 1; }
  </style>

  <text class="title" x="30" y="40">The Commitments Behind a Close</text>
  <text class="note" x="30" y="69">Three shared roots derived by each validator</text>

  <rect class="selected" x="405" y="98" width="510" height="90" rx="5"/>
  <text class="heading center blue" x="660" y="133">32-byte close commitment</text>
  <text class="note center" x="660" y="165">binds all three roots</text>
  <path class="focus" d="M660 188 V219 M214 244 V219 H1106 V244 M660 219 V244"/>

  <rect class="panel" x="30" y="244" width="368" height="568" rx="5"/>
  <text class="heading center" x="214" y="284">Account Balances</text>
  <text class="note center" x="214" y="313">QMDB · positive balances</text>
  <rect class="record" x="122" y="346" width="184" height="42" rx="3"/>
  <text class="label center" x="214" y="373">State root</text>
  <path class="link" d="M214 388 V422"/>
  <rect class="record" x="66" y="422" width="296" height="242" rx="3"/>
  <text class="note" x="89" y="453">account</text>
  <text class="note right" x="339" y="453">balance</text>
  <path class="rule" d="M66 468 H362"/>
  <text class="mono" x="94" y="505">a</text>
  <text class="mono right" x="335" y="505">85</text>
  <text class="mono" x="94" y="550">b</text>
  <text class="mono right" x="335" y="550">58</text>
  <rect x="67" y="564" width="294" height="44" fill="#f4f4ff"/>
  <text class="mono blue" x="94" y="595">c</text>
  <text class="mono right blue" x="335" y="595">26</text>
  <text class="mono" x="94" y="640">d</text>
  <text class="mono right" x="335" y="640">31</text>
  <text class="label center" x="214" y="710">Kept across closes</text>
  <text class="note center" x="214" y="749">Prove a balance</text>
  <text class="note center" x="214" y="775">for withdrawal or recovery</text>

  <rect class="panel" x="430" y="244" width="460" height="568" rx="5"/>
  <text class="heading center" x="660" y="284">Account Activity</text>
  <text class="note center" x="660" y="313">MMR · cumulative operation log</text>
  <rect class="record" x="568" y="346" width="184" height="42" rx="3"/>
  <text class="label center" x="660" y="373">Activity root</text>
  <path class="link" d="M660 388 V405 H492 V418 M536 439 H552 M588 439 H594 M630 439 H636 M672 439 H678 M714 439 H735 V503 H466 V514"/>
  <rect class="record" x="448" y="418" width="88" height="42" rx="3"/>
  <rect class="record" x="552" y="418" width="36" height="42" rx="3"/>
  <rect class="record" x="594" y="418" width="36" height="42" rx="3"/>
  <rect class="selected" x="636" y="418" width="36" height="42" rx="3"/>
  <rect class="record" x="678" y="418" width="36" height="42" rx="3"/>
  <text class="note center" x="492" y="445">prior ops</text>
  <text class="mono center" x="570" y="446">a</text>
  <text class="mono center" x="612" y="446">b</text>
  <text class="mono center blue" x="654" y="446">c</text>
  <text class="mono center" x="696" y="446">d</text>
  <path class="focus" d="M552 468 V476 H714 V468"/>
  <text class="note center blue" x="633" y="497" style="font-size:15px;">row_count = 4 · [A0, A0+G)</text>

  <rect class="record" x="448" y="514" width="36" height="42" rx="3"/>
  <rect class="record" x="494" y="514" width="104" height="42" rx="3"/>
  <rect class="record" x="608" y="514" width="104" height="42" rx="3"/>
  <rect class="record" x="722" y="514" width="36" height="42" rx="3"/>
  <rect class="record" x="768" y="514" width="108" height="42" rx="3"/>
  <text class="note center" x="466" y="541">…</text>
  <text class="note center" x="546" y="532" style="font-size:14px;">Entry</text>
  <text class="note center" x="546" y="549" style="font-size:14px;">b · 4 · 1</text>
  <text class="note center" x="660" y="532" style="font-size:14px;">Entry</text>
  <text class="note center" x="660" y="549" style="font-size:14px;">d · 7 · 1</text>
  <text class="note center" x="740" y="541">…</text>
  <text class="note center" x="822" y="541" style="font-size:14px;">Commit(None)</text>
  <path class="focus" d="M494 564 V572 H712 V564"/>
  <text class="note center blue" x="603" y="591" style="font-size:15px;">c entries · 4 + 7 = debit 11</text>

  <path class="focus" d="M654 460 V478 H882 V642 H852"/>
  <rect class="selected" x="468" y="604" width="384" height="84" rx="3"/>
  <text class="label blue" x="490" y="630">c's activity Row</text>
  <text class="label" x="490" y="656">debit 11 · sequence 2</text>
  <text class="note center blue" x="660" y="681" style="font-size:16px;">c-signed outgoing-payment BMT root</text>
  <path class="focus" d="M660 688 V712 M660 712 L565 724 M660 712 L755 724"/>
  <rect class="record" x="478" y="724" width="174" height="64" rx="3"/>
  <rect class="record" x="668" y="724" width="174" height="64" rx="3"/>
  <text class="label center" x="565" y="749">to b: 4</text>
  <text class="note center" x="565" y="775">1 payment</text>
  <text class="label center" x="755" y="749">to d: 7</text>
  <text class="note center" x="755" y="775">1 payment</text>

  <rect class="panel" x="922" y="244" width="368" height="568" rx="5"/>
  <text class="heading center" x="1106" y="284">Payouts</text>
  <text class="note center" x="1106" y="313">MMR · cumulative payout log</text>
  <rect class="record" x="965" y="346" width="282" height="42" rx="3"/>
  <text class="label center" x="1106" y="373">Payout root</text>
  <path class="link" d="M1106 388 V401 M1009 401 H1187 M1009 401 V412 M1094 401 V412 M1187 401 V412"/>
  <rect class="record" x="957" y="412" width="104" height="42" rx="3"/>
  <rect class="record" x="1073" y="412" width="42" height="42" rx="3"/>
  <rect class="record" x="1127" y="412" width="120" height="42" rx="3"/>
  <text class="note center" x="1009" y="439">prior ops</text>
  <text class="note center" x="1094" y="439">…</text>
  <text class="note center" x="1187" y="439" style="font-size:16px;">Commit(None)</text>
  <text class="note center blue" x="1106" y="482">no new payouts this close</text>
  <path class="rule" d="M946 501 H1266"/>
  <text class="note center" x="1106" y="532">Addressed by append location</text>
  <rect class="record" x="999" y="550" width="214" height="74" rx="3"/>
  <text class="label center" x="1106" y="580">destination</text>
  <text class="label center" x="1106" y="608">amount</text>
  <text class="label center" x="1106" y="710">Appended by validators</text>
  <text class="note center" x="1106" y="749">Open against the current</text>
  <text class="note center" x="1106" y="775">finalized payout root</text>
</svg>
