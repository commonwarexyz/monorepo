<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 930" role="img" aria-labelledby="title description">
  <title id="title">The Commitments Behind a Close</title>
  <desc id="description">Each validator derives the three shared protocol roots: the QMDB balance root and the cumulative activity and candidate payout MMR roots and counts. The activity log shows prior operations followed by this epoch's contiguous a, b, c, and d account rows, then one source-metadata Commit outside the certified row range. The commitment binds these values to the ProposalId, epoch, predecessor, ranges, and outflow totals. QMDB carries positive balances of a: 85, b: 58, c: 26, and d: 31 into the next epoch. Account c's activity row shows 11 sent, final batch sequence 2, no withdrawal, and its signed payer-vector BMT root. That BMT records one payment of 4 to b and one of 7 to d. Activity rows support receipt challenges even when an account's balance does not change. This epoch creates no payouts and appends only the metadata-free payout-log Commit. The right panel shows the stable append location, destination, and amount opened against the current finalized payout root and count. A fourth private QMDB protects the validator's local signing decisions but is not part of the certified commitment and is not shown.</desc>
  <rect width="1320" height="930" fill="#fff"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #111; }
    .heading { font-size: 22px; font-weight: 700; fill: #111; }
    .label { font-size: 19px; fill: #333; }
    .note { font-size: 17px; fill: #666; }
    .mono { font-size: 21px; fill: #111; }
    .center { text-anchor: middle; }
    .right { text-anchor: end; }
    .blue { fill: #2424d4; }
    .panel { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1.5; }
    .record { fill: #fff; stroke: #bcbcbc; stroke-width: 1.5; }
    .selected { fill: #f4f4ff; stroke: #2424d4; stroke-width: 1.5; }
    .link { fill: none; stroke: #999; stroke-width: 1.5; }
    .focus { fill: none; stroke: #2424d4; stroke-width: 2; }
    .rule { stroke: #dedede; stroke-width: 1; }
  </style>

  <text class="title" x="30" y="40">The Commitments Behind a Close</text>
  <text class="note" x="30" y="69">Three shared roots and log counts derived by each validator</text>

  <rect class="selected" x="405" y="98" width="510" height="90" rx="5"/>
  <text class="heading center blue" x="660" y="133">Commitment</text>
  <text class="note center" x="660" y="158">ProposalId · epoch · predecessor</text>
  <text class="note center" x="660" y="178">ranges · outflow totals</text>
  <path class="focus" d="M660 188 V219 M214 244 V219 H1106 V244 M660 219 V244"/>

  <rect class="panel" x="30" y="244" width="368" height="568" rx="5"/>
  <text class="heading center" x="214" y="284">Account Balances</text>
  <text class="note center" x="214" y="313">QMDB · positive balances</text>
  <rect class="record" x="122" y="346" width="184" height="42" rx="3"/>
  <text class="label center" x="214" y="373">State root</text>
  <path class="link" d="M214 388 V422"/>
  <rect class="record" x="66" y="422" width="296" height="242" rx="3"/>
  <text class="note" x="89" y="453">account</text>
  <text class="note right" x="339" y="453">balance</text>
  <path class="rule" d="M66 468 H362"/>
  <text class="mono" x="94" y="505">a</text>
  <text class="mono right" x="335" y="505">85</text>
  <text class="mono" x="94" y="550">b</text>
  <text class="mono right" x="335" y="550">58</text>
  <rect x="67" y="564" width="294" height="44" fill="#f4f4ff"/>
  <text class="mono blue" x="94" y="595">c</text>
  <text class="mono right blue" x="335" y="595">26</text>
  <text class="mono" x="94" y="640">d</text>
  <text class="mono right" x="335" y="640">31</text>
  <text class="label center" x="214" y="710">Kept across closes</text>
  <text class="note center" x="214" y="749">Prove a balance</text>
  <text class="note center" x="214" y="775">for withdrawal or recovery</text>

  <rect class="panel" x="430" y="244" width="460" height="654" rx="5"/>
  <text class="heading center" x="660" y="284">Account Activity</text>
  <text class="note center" x="660" y="313">MMR · cumulative operation log</text>
  <rect class="record" x="568" y="346" width="184" height="42" rx="3"/>
  <text class="label center" x="660" y="373">Root + count</text>
  <path class="link" d="M660 388 V412 M517 412 H838 M517 412 V430 M611 412 V430 M665 412 V430 M719 412 V430 M770 412 V430 M838 412 V430"/>
  <rect class="record" x="462" y="430" width="110" height="42" rx="3"/>
  <rect class="record" x="590" y="430" width="42" height="42" rx="3"/>
  <rect class="record" x="644" y="430" width="42" height="42" rx="3"/>
  <rect class="selected" x="698" y="430" width="42" height="42" rx="3"/>
  <rect class="record" x="752" y="430" width="36" height="42" rx="3"/>
  <rect class="record" x="800" y="430" width="76" height="42" rx="3"/>
  <text class="note center" x="517" y="457">prior ops</text>
  <text class="mono center" x="611" y="458">a</text>
  <text class="mono center" x="665" y="458">b</text>
  <text class="mono center blue" x="719" y="458">c</text>
  <text class="mono center" x="770" y="458">d</text>
  <text class="note center" x="838" y="457">Commit</text>
  <path class="focus" d="M590 480 V490 H788 V480"/>
  <text class="note center blue" x="689" y="512">epoch e · [A0, A1)</text>
  <path class="focus" d="M719 472 V478 H878 V552 H852"/>
  <rect class="selected" x="468" y="522" width="384" height="136" rx="3"/>
  <text class="label blue" x="490" y="552">c at the end of the epoch</text>
  <text class="label" x="490" y="584">sent 11 · last batch #2</text>
  <text class="note" x="490" y="614">withdrawal: none</text>
  <text class="label center blue" x="660" y="643">Signed BMT root</text>
  <path class="focus" d="M660 658 V709 M660 748 L565 787 M660 748 L755 787"/>
  <rect class="selected" x="553" y="709" width="214" height="39" rx="3"/>
  <text class="label center blue" x="660" y="735">c's payments</text>
  <rect class="record" x="478" y="787" width="174" height="64" rx="3"/>
  <rect class="record" x="668" y="787" width="174" height="64" rx="3"/>
  <text class="label center" x="565" y="812">to b: 4</text>
  <text class="note center" x="565" y="838">1 payment</text>
  <text class="label center" x="755" y="812">to d: 7</text>
  <text class="note center" x="755" y="838">1 payment</text>
  <text class="note center" x="660" y="877">Check receipts against the close</text>

  <rect class="panel" x="922" y="244" width="368" height="568" rx="5"/>
  <text class="heading center" x="1106" y="284">Payouts</text>
  <text class="note center" x="1106" y="313">MMR · cumulative payout log</text>
  <rect class="record" x="965" y="346" width="282" height="42" rx="3"/>
  <text class="label center" x="1106" y="373">Candidate root + count</text>
  <path class="link" d="M1106 388 V409"/>
  <text class="note center" x="1106" y="434">Commit(None) only</text>
  <path class="rule" d="M946 465 H1266"/>
  <text class="note center" x="1106" y="504">Each payout records</text>
  <rect class="record" x="999" y="526" width="214" height="100" rx="3"/>
  <text class="label center" x="1106" y="554">append location</text>
  <text class="label center" x="1106" y="582">destination</text>
  <text class="label center" x="1106" y="610">amount</text>
  <text class="label center" x="1106" y="710">Appended by validators</text>
  <text class="note center" x="1106" y="749">Open against the current</text>
  <text class="note center" x="1106" y="775">finalized root + count</text>
</svg>
