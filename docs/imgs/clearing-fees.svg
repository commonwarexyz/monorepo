<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title description">
  <title id="title">Collecting a fee in one signed batch</title>
  <desc id="description">In an independent fresh-epoch example, payer a signs one batch that pays 20 to b, 7 to c, and 2 to the operator's designated fee account, for a total debit of 29. The fee of 2 is an example operator quote, not a protocol constant. The operator checks that the ordinary fee increment satisfies its policy, then countersigns the same payer state once. One acknowledgment binds the entire batch. Validators net all three entries as ordinary payments, with no fee-specific protocol machinery.</desc>
  <rect width="1080" height="520" fill="#fff"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #111; }
    .subtitle { font-size: 14px; fill: #666; }
    .heading { font-size: 18px; font-weight: 700; fill: #111; }
    .label { font-size: 16px; fill: #333; }
    .note { font-size: 14px; fill: #666; }
    .center { text-anchor: middle; }
    .right { text-anchor: end; }
    .blue { fill: #2424d4; }
    .green { fill: #14733b; }
    .step { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1.5; }
    .selected { fill: #fff; stroke: #2424d4; stroke-width: 1.5; }
    .accepted { fill: #f1fbf5; stroke: #73b58e; stroke-width: 1.5; }
    .number { fill: #2424d4; }
    .number-text { font-size: 16px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .flow { fill: none; stroke: #2424d4; stroke-width: 2; marker-end: url(#arrow); }
    .rule { stroke: #dedede; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2424d4"/>
    </marker>
  </defs>

  <text class="title" x="36" y="46">Collecting Fees in a Batch</text>
  <text class="subtitle" x="36" y="78">Fresh-epoch example · the operator quotes a fee of 2.</text>

  <rect class="step" x="36" y="104" width="476" height="272" rx="6"/>
  <circle class="number" cx="66" cy="137" r="15"/>
  <text class="number-text" x="66" y="143">1</text>
  <text class="heading" x="92" y="144">Payer a signs one batch</text>
  <rect class="selected" x="58" y="166" width="432" height="186" rx="5"/>
  <text class="label blue" x="80" y="195">ONE SIGNATURE</text>
  <text class="label right blue" x="468" y="195">debit 29</text>
  <path class="rule" d="M80 210 H468 M80 252 H468 M80 294 H468"/>
  <text class="label" x="80" y="236">to b</text>
  <text class="label right" x="468" y="236">20</text>
  <text class="label" x="80" y="278">to c</text>
  <text class="label right" x="468" y="278">7</text>
  <text class="label blue" x="80" y="320">to operator fee account</text>
  <text class="label right blue" x="468" y="320">2</text>

  <path class="flow" d="M528 254 H568"/>

  <rect class="step" x="584" y="104" width="460" height="272" rx="6"/>
  <circle class="number" cx="614" cy="137" r="15"/>
  <text class="number-text" x="614" y="143">2</text>
  <text class="heading" x="640" y="144">Operator checks the fee</text>
  <rect class="accepted" x="608" y="168" width="412" height="55" rx="5"/>
  <text class="label center green" x="814" y="202">increment 2 meets quote</text>
  <path class="flow" d="M814 236 V259"/>
  <rect class="selected" x="608" y="272" width="412" height="80" rx="5"/>
  <text class="label center blue" x="814" y="302">COUNTERSIGN ONCE</text>
  <text class="note center" x="814" y="330">Same payer state · all three payments</text>

  <path class="flow" d="M814 388 V414"/>

  <rect class="step" x="36" y="430" width="1008" height="64" rx="6"/>
  <circle class="number" cx="66" cy="462" r="15"/>
  <text class="number-text" x="66" y="468">3</text>
  <text class="heading" x="92" y="469">Validators net all three as ordinary payments</text>
</svg>
