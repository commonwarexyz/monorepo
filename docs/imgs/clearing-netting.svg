<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 590" role="img" aria-labelledby="title description">
  <title id="title">Netting Across Accounts</title>
  <desc id="description">100 million payments of $0.000001 across six directed pairs produce four net balance changes in one epoch. Account a sends $30 and receives $10, ending at $80. Account b sends $25 and receives $55, ending at $70. Account c sends $20 and receives $25, ending at $30. Account d sends $25 and receives $10, ending at $20. The close carries four account rows and six cumulative entries with consistency proofs.</desc>
  <rect width="1320" height="590" fill="#fff"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #111; }
    .subtitle { font-size: 16px; fill: #666; }
    .panel-title { font-size: 20px; font-weight: 700; fill: #111; text-anchor: middle; }
    .frame { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1.5; }
    .payment { fill: none; stroke: #2424d4; stroke-width: 2.5; marker-end: url(#arrow); }
    .amount { font-size: 20px; fill: #2424d4; text-anchor: middle; }
    .node { fill: #fff; stroke: #2424d4; stroke-width: 2; }
    .account { font-size: 22px; font-weight: 700; fill: #2424d4; text-anchor: middle; }
    .heading { font-size: 16px; fill: #666; text-anchor: end; }
    .small { font-size: 14px; fill: #666; text-anchor: end; }
    .money { font-size: 20px; fill: #111; text-anchor: end; }
    .net { font-weight: 700; fill: #2424d4; }
    .rule { stroke: #dedede; stroke-width: 1; }
    .note { font-size: 16px; fill: #555; text-anchor: middle; }
    .close { fill: #f4f4ff; stroke: #2424d4; stroke-width: 1.5; }
    .close-title { font-size: 22px; font-weight: 700; fill: #2424d4; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#2424d4" stroke-width="1.2"/>
    </marker>
  </defs>

  <text class="title" x="34" y="39">Netting Across Accounts</text>
  <text class="subtitle" x="34" y="66">100 million $0.000001 payments through one operator in one epoch</text>

  <rect class="frame" x="34" y="94" width="508" height="378" rx="6"/>
  <text class="panel-title" x="288" y="127">6 cumulative payment entries</text>
  <g class="payment">
    <path d="M166 202 H397"/>
    <path d="M445 219 C490 253 490 335 446 366"/>
    <path d="M399 386 H164"/>
    <path d="M138 360 V228"/>
    <path d="M414 361 C379 316 379 270 420 229"/>
    <path d="M162 372 L399 219"/>
  </g>
  <text class="amount" x="282" y="188">$30</text>
  <text class="amount" x="510" y="300">$25</text>
  <text class="amount" x="282" y="418">$10</text>
  <text class="amount" x="102" y="301">$10</text>
  <text class="amount" x="419" y="301">$10</text>
  <text class="amount" x="278" y="280">$15</text>
  <circle class="node" cx="138" cy="202" r="22"/>
  <circle class="node" cx="425" cy="202" r="22"/>
  <circle class="node" cx="425" cy="386" r="22"/>
  <circle class="node" cx="138" cy="386" r="22"/>
  <text class="account" x="138" y="209">a</text>
  <text class="account" x="425" y="209">b</text>
  <text class="account" x="425" y="393">c</text>
  <text class="account" x="138" y="393">d</text>
  <text class="note" x="288" y="451">Arrows show each pair's total.</text>

  <path d="M555 284 H588 M580 278 L588 284 L580 290" fill="none" stroke="#777" stroke-width="2"/>

  <rect class="frame" x="602" y="94" width="684" height="378" rx="6"/>
  <text class="panel-title" x="944" y="127">4 net balance changes</text>
  <text class="heading" x="790" y="172">Sent</text>
  <text class="heading" x="928" y="172">Received</text>
  <text class="heading" x="1048" y="172">Net</text>
  <text class="heading" x="1252" y="172">Balance</text>
  <text class="small" x="1252" y="192">before → after</text>
  <path class="rule" d="M626 204 H1262 M626 251 H1262 M626 305 H1262 M626 359 H1262 M626 413 H1262"/>
  <g>
    <text class="account" x="650" y="235">a</text>
    <text class="money" x="790" y="235">$30</text>
    <text class="money" x="928" y="235">$10</text>
    <text class="money net" x="1048" y="235">−$20</text>
    <text class="money" x="1252" y="235">$100 → $80</text>
  </g>
  <g>
    <text class="account" x="650" y="289">b</text>
    <text class="money" x="790" y="289">$25</text>
    <text class="money" x="928" y="289">$55</text>
    <text class="money net" x="1048" y="289">+$30</text>
    <text class="money" x="1252" y="289">$40 → $70</text>
  </g>
  <g>
    <text class="account" x="650" y="343">c</text>
    <text class="money" x="790" y="343">$20</text>
    <text class="money" x="928" y="343">$25</text>
    <text class="money net" x="1048" y="343">+$5</text>
    <text class="money" x="1252" y="343">$25 → $30</text>
  </g>
  <g>
    <text class="account" x="650" y="397">d</text>
    <text class="money" x="790" y="397">$25</text>
    <text class="money" x="928" y="397">$10</text>
    <text class="money net" x="1048" y="397">−$15</text>
    <text class="money" x="1252" y="397">$35 → $20</text>
  </g>
  <text class="note" x="944" y="451">Net change: $0 · Total balance: $200 → $200</text>

  <rect class="close" x="34" y="500" width="1252" height="76" rx="6"/>
  <text class="close-title" x="660" y="531">4 active accounts · 6 payment pairs</text>
  <text class="note" x="660" y="558">One row per account · one cumulative entry per pair · consistency proofs</text>
</svg>
