[package]
name = "commonware-cryptography-curve25519"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Curve25519 field/group arithmetic and the Ed25519 signature scheme."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/cryptography/curve25519"
documentation = "https://docs.rs/commonware-cryptography-curve25519"

[lints]
workspace = true

[dependencies]
commonware-macros.workspace = true
commonware-parallel.workspace = true
rand_core.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
commonware-parallel = { workspace = true, features = [ "std" ] }
commonware-utils = { workspace = true, features = [ "std" ] }
criterion.workspace = true
ed25519-consensus.workspace = true

[lib]
bench = false

[[bench]]
name = "batch_verify"
harness = false
path = "benches/batch_verify.rs"

[features]
default = [ "std" ]
std = [ "commonware-parallel/std" ]
