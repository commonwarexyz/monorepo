[package]
name = "commonware-cryptography-curve25519"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Curve25519 field/group arithmetic, the Ed25519 signature scheme, and X25519 key exchange."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/cryptography/curve25519"
documentation = "https://docs.rs/commonware-cryptography-curve25519"

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
bytes.workspace = true
commonware-codec.workspace = true
commonware-macros.workspace = true
commonware-math.workspace = true
commonware-parallel.workspace = true
commonware-utils.workspace = true
rand_core.workspace = true
sha2.workspace = true

[dev-dependencies]
arbitrary.workspace = true
commonware-conformance.workspace = true
commonware-formatting.workspace = true
commonware-invariants.workspace = true
commonware-parallel = { workspace = true, features = [ "std" ] }
commonware-utils = { workspace = true, features = [ "std" ] }
criterion.workspace = true
ed25519-consensus.workspace = true
x25519-dalek.workspace = true

[lib]
bench = false

[[bench]]
name = "batch_verify"
harness = false
path = "benches/batch_verify.rs"

[features]
default = [ "std" ]
arbitrary = [
	"commonware-codec/arbitrary",
	"commonware-math/arbitrary",
	"commonware-utils/arbitrary",
	"dep:arbitrary",
]
std = [
	"bytes/std",
	"commonware-codec/std",
	"commonware-macros/std",
	"commonware-math/std",
	"commonware-parallel/std",
	"commonware-utils/std",
]
