[package]
name = "commonware-cryptography-curve25519-fuzz"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary.workspace = true
commonware-codec.workspace = true
commonware-cryptography.workspace = true
commonware-cryptography-curve25519 = { workspace = true, features = [ "fuzz" ] }
commonware-math.workspace = true
commonware-parallel = { workspace = true, features = [ "std" ] }
commonware-runtime.workspace = true
commonware-utils = { workspace = true, features = [ "arbitrary" ] }
libfuzzer-sys.workspace = true
rand_core.workspace = true

[[bin]]
name = "curve25519"
path = "fuzz_targets/curve25519.rs"
test = false
doc = false
bench = false

[[bin]]
name = "curve25519_types"
path = "fuzz_targets/curve25519_types.rs"
test = false
doc = false
bench = false
