[package]
name = "commonware-cryptography-bls12381"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "BLS12-381 cryptography."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/cryptography/bls12381"
documentation = "https://docs.rs/commonware-cryptography-bls12381"

[lints]
workspace = true

[dependencies]
commonware-macros.workspace = true
commonware-simd.workspace = true

[dev-dependencies]
arbitrary.workspace = true
blst.workspace = true
commonware-invariants.workspace = true
criterion.workspace = true

[lib]
bench = false

[[bench]]
name = "field"
harness = false
path = "src/field/benches/bench.rs"

[[bench]]
name = "curve"
harness = false
path = "src/curve/benches/bench.rs"

[features]
default = [ "std" ]
std = [
	"commonware-macros/std",
	"commonware-simd/std",
]
