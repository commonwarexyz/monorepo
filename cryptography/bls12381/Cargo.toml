[package]
name = "commonware-cryptography-bls12381"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "BLS12-381 cryptography."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/cryptography/bls12381"
documentation = "https://docs.rs/commonware-cryptography-bls12381"

[lints]
workspace = true

[dependencies]
commonware-macros.workspace = true
commonware-simd.workspace = true

[dev-dependencies]
arbitrary.workspace = true
blst.workspace = true
commonware-allocator = { workspace = true, features = [ "mimalloc" ] }
commonware-invariants.workspace = true
criterion.workspace = true

[lib]
bench = false

[[bench]]
name = "field"
harness = false
path = "src/core/field/benches/bench.rs"
required-features = [ "core" ]

[[bench]]
name = "curve"
harness = false
path = "src/core/curve/benches/bench.rs"
required-features = [ "core" ]

[[bench]]
name = "pairing"
harness = false
path = "src/core/pairing/benches/bench.rs"
required-features = [ "core" ]

[features]
default = [ "std" ]
# Exposes the low-level arithmetic, which the benchmarks measure directly.
core = []
std = [
	"commonware-macros/std",
	"commonware-simd/std",
]
