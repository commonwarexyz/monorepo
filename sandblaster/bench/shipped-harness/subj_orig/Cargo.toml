# A subject of the shipped-code harness: subject/lib.rs over the orig copies of
# commonware-codec and commonware-storage (gen/orig/, prepare.py). No build
# script, no profile of its own.
[package]
name = "subj_orig"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../subject/lib.rs"

[dependencies]
codec = { package = "sbx-ship-orig-codec", path = "../gen/orig/codec" }
storage = { package = "sbx-ship-orig-storage", path = "../gen/orig/storage" }
commonware-cryptography = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
