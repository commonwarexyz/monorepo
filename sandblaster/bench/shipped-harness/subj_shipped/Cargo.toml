# A subject of the shipped-code harness: subject/lib.rs over the shipped copies of
# commonware-codec and commonware-storage (gen/shipped/, prepare.py). No build
# script, no profile of its own.
[package]
name = "subj_shipped"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../subject/lib.rs"

[dependencies]
codec = { package = "sbx-ship-shipped-codec", path = "../gen/shipped/codec" }
storage = { package = "sbx-ship-shipped-storage", path = "../gen/shipped/storage" }
commonware-cryptography = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
