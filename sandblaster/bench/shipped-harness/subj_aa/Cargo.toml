# A subject of the shipped-code harness: subject/lib.rs over the aa copies of
# commonware-codec and commonware-storage (gen/aa/, prepare.py). No build
# script, no profile of its own.
[package]
name = "subj_aa"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "../subject/lib.rs"

[dependencies]
codec = { package = "sbx-ship-aa-codec", path = "../gen/aa/codec" }
storage = { package = "sbx-ship-aa-storage", path = "../gen/aa/storage" }
commonware-cryptography = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
