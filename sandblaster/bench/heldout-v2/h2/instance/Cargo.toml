# H2-v2's instance chooser (RULE.md section 3.1): a rustc driver that asks
# rustc's trait solver which types satisfy each generic candidate's bounds
# and which combinations instantiate it. Built with the pinned nightly of
# sandblaster/mirx/rust-toolchain.toml (rustc-dev), like sandblaster-mirx;
# not a member of any workspace. Run by ../instance.py.
[package]
name = "sb-h2v2-instance"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "sb-h2v2-instance"
path = "src/main.rs"
