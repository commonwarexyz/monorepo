[package]
name = "sandblaster-front"
description = "sandblaster front end: parsing, resolution, elaboration, automation, the MIR lift, the §15 gates."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published yet: the toolchain lives in the monorepo as a build tool.
publish = false

[dependencies]
sandblaster-kernel.workspace = true
sandblaster-memguard.workspace = true
# the target semantics library (DESIGN.md §1.1 item 4, §9.2): the core-text
# models' hashes (the lock header's `target <arch>` line) and their hardware
# evidence (the `target-model:` lock items); dependency-free crate
sandblaster-targets.workspace = true
syn = { workspace = true, features = ["full", "extra-traits", "visit", "visit-mut", "parsing", "printing"] }
quote.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
num-bigint = { workspace = true, features = ["std"] }
num-traits = { workspace = true, features = ["std"] }

[features]
# Declared only because `src/intrinsics.rs` (hashed into every SPEC.lock, so
# kept byte-identical) names it in a `cfg`; nothing enables it (the
# optimizer's test hooks were removed with the optimizer).
opt-test-hooks = []

[lints.rust]
# `cfg(sandblaster)` is the ghost marker of DSL sources (DESIGN.md §2; the
# build declares it the same way); test programs that rustc also compiles
# carry it (`tests/redteam_fidelity.rs`)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(sandblaster)"] }
