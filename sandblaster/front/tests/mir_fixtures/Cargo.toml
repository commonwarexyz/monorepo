# The toolchain's own MIR fixtures (sandblaster/front/tests): small crates
# whose modules the front end's tests lift, with rustc's MIR checked in
# next to them (`*.sbmir`; regenerate with `extract.py`, which writes this
# member list). Not part of the monorepo's workspace: nothing here is
# built by the workspace build.
[workspace]
resolver = "2"
members = [
    "ai_err",
    "ai_lit",
    "ai_panics",
    "ai_ref_abs",
    "ai_ref_add",
    "ai_ref_lt",
    "ai_ref_widen",
    "ai_signed",
    "bl_mbits_edited",
    "conf_inplace",
    "conf_m",
    "conf_w",
    "conf_w64",
    "fx_cfg_if",
    "fx_codec",
    "fx_hosts",
    "ic_two",
    "lift_w",
    "lk_host",
    "lk_paths",
    "lk_prim",
    "lk_rec",
    "lo_asserts",
    "lo_expect",
    "lo_halve",
    "lo_hosty",
    "lo_iter",
    "lo_open_big9",
    "lo_open_small",
    "lo_ops",
    "lo_partly",
    "lo_partly_call",
    "lo_safe",
    "lo_two",
    "lo_walk",
    "lv_bump",
    "lv_er",
    "lv_inv",
    "lv_items",
    "lv_rec",
    "lv_st",
    "lv_tr",
    "lv_wb",
