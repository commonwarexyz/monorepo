# The general optimizer corpus (docs/optimizer-plan.md O1; design §2.3, §15).
#
# One [[program]] per corpus program. Fields:
#   id, name, entry            the program and its entry point (an item path)
#   functions                  every function of the program
#   pattern                    what it exhibits
#   route, rung, proof         the expected optimizer route, fallback-ladder rung
#                              and proof route once the planned milestones land
#   target_ratio               emitted / ideal on aarch64 at the end of the plan
#                              (design §15: non-controls within 1.25x; controls
#                              no more than 2% slower than today)
#   milestone, milestone_target  the plan milestone that must reach it (§4.2)
#   control                    a control program (LLVM already optimizes it)
#   baseline.<input>           [generated ns, ideal ns] per call on aarch64 (M5 Pro)
#                              as recorded when the corpus was designed
#                              (research/optdesign/run_corpus1.txt, design §2.3);
#                              P15-P20: the O1 emission, re-recorded with the
#                              three-subject harness (a copy of
#                              bench/opt-corpus/recorded.tsv, composition
#                              294d6b84b213, 2026-09-25, load 3.9-4.4: P20's
#                              ideal no longer `#[inline(never)]`, see its
#                              entry; composition 9977202fed3b, 2026-09-24,
#                              load 1.0-1.2, in recorded-history.tsv)
#   today.<function>           the optimizer's outcome today: `Specialized` (the
#                              straight-line rung, linked by conversion),
#                              `Specialized (driven)` (the driven rung, linked by
#                              its equality lemma; O4), `Specialized (driven;
#                              straight-line superseded)` (both admitted, the
#                              driven residual chosen), or
#                              `Unspecialized: <reason>` (asserted by
#                              tests/opt_explore.rs; every later milestone
#                              updates these deliberately)
#   must_reject                the program's must-reject variant (must_reject.rs)
#   must_reject_note           what is wrong with it
#   witness                    kernel-evaluation arguments (JSON, `sandblaster eval`
#                              format) on which the variant differs from `entry`
#
# Must-reject pairs (tests/opt_reject.rs, gate G4). A rejected wrong candidate
# is evidence only when a correct candidate of the same shape (its control) is
# admitted: a route may refuse a whole shape whether the candidate is right or
# wrong. Each program has two pairs, each asserted as classified here:
#   conv_control, conv_mutant  a candidate today's route (tier-0 conversion)
#                              admits and its one-token mutation
#                              (conv_pairs.rs); conv_mutation names the token,
#                              conv_witness an input on which the mutant differs
#   must_reject_control        the frozen variant with its bug fixed
#                              (must_reject_controls.rs)
#   conv_status,               `attributable` (the control is admitted and the
#   must_reject_status         mutant rejected), `pending O<n>: <route>` (both
#                              rejected until milestone O<n>'s route admits the
#                              shape) or `unattributable: <why>`
#   conv_reason,               the mutant's rejection, pinned:
#   must_reject_reason         `<rejected_by> | <fragment of the kernel message>`
#   conv_control_reason,       the control's rejection, pinned, exactly when
#   must_reject_control_reason the pair is not attributable
#   probes                     extra inputs on which every control must agree
#                              with `entry` (with both witnesses)
# A conversion pair is attributable exactly when `entry` is `Specialized`
# today. A milestone whose route starts admitting a control updates its pair
# deliberately (the test fails until it does).
#
# The DSL is dsl/mod.rs (P1-P14, frozen: gate G6) plus one file per later
# program. The native harness (generated vs ideal, checks first) is
# bench/opt-corpus.

[[program]]
id = "P1"
name = "bit length (shift-until-zero loop, with fuel)"
entry = "crate::bit_length"
functions = ["crate::bit_length", "crate::bit_length_go"]
pattern = "shift right until zero, counting"
route = "Σ2 closed form: 64 − clz(x)"
rung = "ClosedForm"
proof = "per-literal lemmas over K1 leading_zeros_def"
target_ratio = 1.25
milestone = "O6"
milestone_target = "within 1.25x of ideal"
control = false
baseline."uniform bit length" = [9.96, 0.97]
baseline."x < 34" = [1.90, 0.96]
today."crate::bit_length_go" = "Unspecialized: not stuck-free: a stuck application of `crate::bit_length_go`"
today."crate::bit_length" = "Specialized (closed form; straight-line superseded)"
must_reject = "crate::must_reject::bit_length"
must_reject_note = "closed form off by one (65 − clz)"
witness = "[5]"
must_reject_control = "crate::must_reject_controls::bit_length"
must_reject_status = "pending O6: Σ2 closed form (Link::Lemma)"
must_reject_reason = "check_residual_equal: TypeMismatch | candidate is not convertible"
must_reject_control_reason = "check_residual_equal: TypeMismatch | candidate is not convertible"
conv_control = "crate::conv_pairs::bit_length"
conv_mutant = "crate::conv_pairs::bit_length_mut"
conv_mutation = "fuel 64 -> 63"
conv_witness = "[\"9223372036854775808\"]"
conv_status = "attributable"
conv_reason = "check_residual_equal: TypeMismatch | candidate is not convertible"
probes = ["[0]", "[1]", "[5]", "[\"1000000007\"]", "[\"18446744073709551615\"]", "[\"9223372036854775808\"]"]

