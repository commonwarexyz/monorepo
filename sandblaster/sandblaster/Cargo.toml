[package]
name = "sandblaster"
description = "sandblaster: Rust verified as written, against reviewed laws, with kernel-checked proofs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Not published yet: the toolchain lives in the monorepo as a build tool.
publish = false

[features]
build = ["dep:sandblaster-front"]

[dependencies]
sandblaster-macros.workspace = true
sandblaster-front = { workspace = true, optional = true }
