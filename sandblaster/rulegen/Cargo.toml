[package]
name = "sandblaster-rulegen"
description = "Offline rule discovery for the optimizer's aegraph (optimizer design §10.5, plan O8): writes lemmas/rules/*.core and lemmas/cong.core, which every build re-checks with the kernel. Never run by a build."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sandblaster-kernel.workspace = true
sandblaster-front.workspace = true
num-bigint = { workspace = true, features = ["std"] }

[[bin]]
name = "sandblaster-rulegen"
path = "src/main.rs"
