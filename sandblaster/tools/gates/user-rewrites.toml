# User-supplied optimization alternatives permitted in the monorepo's DSL roots
# (fairness audit of 2026-10-02, J1/J5; checked by
# sandblaster/front/tests/fairness_rewrites.rs).
#
# A `#[rewrite]` lemma `f(x̄) == g(x̄)` with `g` in a `#[lift(opt)]` module makes
# hand-written code a replacement of `f`: user code, not optimizer output. The
# build reports it apart from the optimizer's residuals (`LowerOrigin::UserRewrite`),
# it never counts in a "faster than rustc" claim, and it is not allowed on a
# benchmark target. Outside the toolchain's toy fixtures
# (sandblaster/front/tests/), every file holding a `#[rewrite]` lemma or a
# `#[lift(opt)]` module must be listed here:
#
#   [[allow]]
#   path = "<repo-relative DSL file>"
#   owner = "<who reviews it>"
#   justification = "<why a hand-written alternative, and why no optimizer pass>"
#   benchmark_excluded = true   # the function is in no benchmark or claim
#
# These can never be listed: storage/src/merkle/** and its DSL roots
# (storage/sandblaster/mmr, storage/sandblaster/verifier), the codec varint
# (codec/src/varint.rs, codec/sandblaster/varint), cryptography's sha256,
# bls12381 and ed25519, coding's Reed–Solomon, and the QMDB fixture
# (sandblaster/fixtures/qmdb).
#
# No entries: no DSL root has a user alternative (the MMR's were removed by
# the audit, J1).
