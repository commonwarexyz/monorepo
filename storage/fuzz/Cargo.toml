[package]
name = "commonware-storage-fuzz"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
commonware-codec.workspace = true
commonware-cryptography.workspace = true
commonware-parallel.workspace = true
commonware-runtime = { workspace = true, features = ["test-utils"] }
commonware-storage = { workspace = true, features = ["std", "fuzzing", "test-traits", "arbitrary"] }
commonware-utils = { workspace = true, features = ["arbitrary"] }
futures.workspace = true
libfuzzer-sys.workspace = true
rand.workspace = true
rand_core.workspace = true

