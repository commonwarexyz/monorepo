[package]
name = "commonware-browser-p2p"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
rust_2018_idioms = "deny"
warnings = "deny"

[target.'cfg(target_arch = "wasm32")'.dependencies]
commonware-codec = { path = "../../../../codec" }
commonware-cryptography = { path = "../../../../cryptography", default-features = false }
commonware-formatting = { path = "../../../../formatting" }
commonware-math = { path = "../../../../math" }
commonware-p2p = { path = "../../../../p2p" }
commonware-runtime = { path = "../../../../runtime", features = ["web"] }
commonware-stream = { path = "../../../../stream" }
commonware-utils = { path = "../../../../utils", features = ["std"] }
commonware-webrtc = { path = "../../../../webrtc" }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
futures = "0.3.32"
hmac = "0.13.0"
js-sys = "0.3.77"
sha2 = "0.11.0"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = [
    "RtcDataChannel",
    "RtcPeerConnection",
] }
