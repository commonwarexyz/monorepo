[package]
name = "commonware-log-multimmit"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Commit to a secret log across concurrent producer chains with Multimmit."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/examples/log-multimmit"
documentation = "https://docs.rs/commonware-log-multimmit"

[lints]
workspace = true

[features]
# Run payment chains: chains with zero pipeline depth and extension bound place only certified
# blocks, go first in the order, and their producers form n - f receipts from aggregate DA votes.
payments = []
# Skip storage durability barriers (fsync, O_DSYNC) for experiments that measure the protocol
# without disk flush latency. A crash can lose or corrupt acknowledged writes: never deploy it.
unsafe-disable-sync = ["commonware-runtime/unsafe-disable-sync"]

[dependencies]
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
commonware-actor.workspace = true
commonware-allocator = { workspace = true, features = ["mimalloc"] }
commonware-broadcast.workspace = true
commonware-codec.workspace = true
commonware-consensus = { workspace = true, features = ["mocks"] }
commonware-cryptography.workspace = true
commonware-deployer.workspace = true
commonware-macros.workspace = true
commonware-p2p.workspace = true
commonware-parallel.workspace = true
commonware-resolver.workspace = true
commonware-runtime = { workspace = true, features = ["mimalloc"] }
commonware-storage.workspace = true
commonware-stream.workspace = true
commonware-utils.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
uuid = { workspace = true, features = ["v4"] }

[[bin]]
name = "commonware-log-multimmit"
bench = false
