[package]
name = "commonware-terminal"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Clear actions through a SQLite operator, settlement, and wallet agent."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/examples/terminal"
documentation = "https://docs.rs/commonware-terminal"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
commonware-actor.workspace = true
commonware-broadcast.workspace = true
commonware-clearing = { workspace = true, features = ["std"] }
commonware-codec = { workspace = true, features = ["std"] }
commonware-consensus.workspace = true
commonware-cryptography = { workspace = true, features = ["bls12381", "std"] }
commonware-cryptography-curve25519 = { workspace = true, features = ["std"] }
commonware-formatting.workspace = true
commonware-glue.workspace = true
commonware-macros.workspace = true
commonware-math.workspace = true
commonware-p2p.workspace = true
commonware-parallel = { workspace = true, features = ["std"] }
commonware-runtime.workspace = true
commonware-storage.workspace = true
commonware-stream.workspace = true
commonware-utils = { workspace = true, features = ["std"] }
crossterm.workspace = true
futures.workspace = true
rand = { workspace = true, features = ["std_rng", "thread_rng"] }
rand_core.workspace = true
ratatui.workspace = true
rusqlite = { workspace = true, features = ["cache"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
commonware-consensus = { workspace = true, features = ["mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
commonware-glue = { workspace = true, features = ["test-utils"] }
commonware-p2p = { workspace = true, features = ["mocks"] }

[[bin]]
name = "terminal-operator"
path = "src/bin/operator.rs"
bench = false

[[bin]]
name = "terminal-agent"
path = "src/bin/agent.rs"
bench = false

[[bin]]
name = "terminal-chain"
path = "src/bin/chain.rs"
bench = false
