[package]
name = "commonware-clearing-fuzz"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata]
cargo-fuzz = true

[lints.cargo]
unused_dependencies = "allow"

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
bytes.workspace = true
commonware-clearing = { workspace = true, features = ["arbitrary"] }
commonware-codec.workspace = true
commonware-cryptography = { workspace = true, features = ["arbitrary", "mocks"] }
commonware-parallel.workspace = true
commonware-runtime.workspace = true
commonware-storage = { workspace = true, features = ["std"] }
commonware-utils = { workspace = true, features = ["arbitrary", "std"] }
libfuzzer-sys.workspace = true
rand_core.workspace = true
thiserror.workspace = true

[lib]
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "functionality"
path = "fuzz_targets/functionality.rs"
test = false
doc = false
bench = false

[[bin]]
name = "twins"
path = "fuzz_targets/twins.rs"
test = false
doc = false
bench = false
