[package]
name = "commonware-clearing-fuzz"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
commonware-clearing = { workspace = true, features = ["arbitrary"] }
commonware-codec.workspace = true
commonware-cryptography = { workspace = true, features = ["arbitrary"] }
commonware-parallel.workspace = true
libfuzzer-sys.workspace = true

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false
