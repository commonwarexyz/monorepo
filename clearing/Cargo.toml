[package]
name = "commonware-clearing"
edition.workspace = true
publish = true
version.workspace = true
license.workspace = true
description = "Settle actions at scale."
readme = "README.md"
homepage.workspace = true
repository = "https://github.com/commonwarexyz/monorepo/tree/main/clearing"
documentation = "https://docs.rs/commonware-clearing"

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
bytes.workspace = true
commonware-codec = { workspace = true, features = ["std"] }
commonware-cryptography = { workspace = true, features = ["std"] }
commonware-macros = { workspace = true, features = ["std"] }
commonware-parallel = { workspace = true, features = ["std"] }
commonware-storage = { workspace = true, features = ["std"] }
commonware-utils = { workspace = true, features = ["std"] }
rand_core.workspace = true
thiserror.workspace = true

[dev-dependencies]
commonware-conformance.workspace = true
commonware-cryptography = { workspace = true, features = ["bls12381", "mocks", "std"] }
commonware-formatting.workspace = true
commonware-runtime = { workspace = true, features = ["test-utils"] }
commonware-utils = { workspace = true, features = ["ruint", "std"] }
ruint.workspace = true
stateright.workspace = true

[features]
arbitrary = [
	"commonware-codec/arbitrary",
	"commonware-cryptography/arbitrary",
	"commonware-storage/arbitrary",
	"commonware-utils/arbitrary",
	"dep:arbitrary",
]

[lib]
bench = false
