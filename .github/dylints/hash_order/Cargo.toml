[package]
name = "hash_order"
version = "0.0.1"
description = "Reject hash-order iteration and hash-order drops of values that wake a task."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.0.0"

[dev-dependencies]
ahash = "0.8.12"
dylint_testing = "6.0.0"
futures-channel = "0.3.32"
hashbrown = "0.17.1"
rayon = "1.12.0"
tokio = { version = "1.52.3", features = ["sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values("hash_order"))'] }

[package.metadata.rust-analyzer]
rustc_private = true
