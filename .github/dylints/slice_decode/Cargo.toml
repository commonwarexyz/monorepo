[package]
name = "slice_decode"
version = "0.0.1"
description = "Reject a slice view of an owned buffer passed where the buffer itself would give the codec refcounted views."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.0.0"

[dev-dependencies]
bytes = "1"
commonware-codec = { path = "../../../codec" }
dylint_testing = "6.0.0"

[package.metadata.rust-analyzer]
rustc_private = true

# The ui fixture is an example target so `dylint_testing` links the
# dev-dependencies into it.
[[example]]
name = "main"
path = "ui/main.rs"
