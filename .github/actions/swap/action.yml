name: Configure Swap
description: Enable swap so memory pressure can spill to disk.
runs:
  using: composite
  steps:
    # Add a swapfile on the same volume used for Cargo builds. This needs no
    # package install, so it cannot stall on an unreachable apt mirror.
    - name: Configure swap (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 1 | sudo tee /sys/module/zswap/parameters/enabled
        cat /sys/module/zswap/parameters/enabled
        # Use 16G, or a quarter of the free space if that is smaller.
        avail_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
        size_gb=$(( avail_gb / 4 < 16 ? avail_gb / 4 : 16 ))
        sudo fallocate -l "${size_gb}G" /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        sudo sysctl -w vm.swappiness=60
        sudo swapon --show
        free -h

    # macOS manages swap dynamically via dynamic_pager.
    - name: Configure swap (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        sudo mkdir -p /private/var/vm
        if ! pgrep -x dynamic_pager >/dev/null; then
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.dynamic_pager.plist || true
        fi
        sysctl vm.swapusage || true
