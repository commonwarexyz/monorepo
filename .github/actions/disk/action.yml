name: Free Disk Space
runs:
  using: composite
  steps:
    - name: Show disk free (before)
      shell: bash
      run: df -h || true

    # Linux Cleanup
    - name: Cleanup (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        (
          TIMEFORMAT='Docker pruning: %3R s'
          time sudo docker image prune --all --force
        ) &
        docker_prune_pid=$!

        # Depth three separates Android NDK versions into independent tasks.
        # Files at that depth are left for the final sweep to avoid a process per file.
        dirs=(/usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup)
        TIMEFORMAT='Parallel deletion: %3R s'
        time sudo find "${dirs[@]}" -mindepth 3 -maxdepth 3 -type d -print0 |
          sudo xargs -0 -r -n 1 -P "$(nproc --ignore=1)" rm -rf -- || true

        TIMEFORMAT='Final sweep: %3R s'
        time sudo rm -rf -- "${dirs[@]}" || true

        wait "$docker_prune_pid" || true

    # macOS Cleanup
    - name: Cleanup (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        docker system prune -af &
        docker_prune_pid=$!
        brew cleanup -s || true
        rm -rf "$(brew --cache)" || true
        # Remove large preinstalled SDKs and runtimes
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/.ghcup || true
        sudo rm -rf ~/Library/Android/sdk || true
        sudo rm -rf ~/Library/Caches || true

        wait "$docker_prune_pid" || true

    - name: Show disk free (after)
      shell: bash
      run: df -h || true
