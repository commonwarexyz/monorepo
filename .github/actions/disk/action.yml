name: Free Disk Space
runs:
  using: composite
  steps:
    - name: Show disk free (before)
      shell: bash
      run: df -h || true

    # Linux Cleanup
    - name: Maximize build space (Linux)
      if: runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true

    # macOS Cleanup
    - name: Cleanup (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euxo pipefail
        docker system prune -af || true
        brew cleanup -s || true
        rm -rf "$(brew --cache)" || true
        # Remove large preinstalled SDKs and runtimes
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/.ghcup || true
        sudo rm -rf ~/Library/Android/sdk || true
        sudo rm -rf ~/Library/Caches || true

    - name: Configure swap (Linux)
      shell: bash
      if: runner.os == 'Linux'
      run: |
        sudo swapoff -a
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo swapon --show

    # macOS manages swap dynamically via dynamic_pager; ensure it is running and report state.
    - name: Configure swap (macOS)
      shell: bash
      if: runner.os == 'macOS'
      run: |
        set -euxo pipefail
        sudo mkdir -p /private/var/vm
        if ! pgrep -x dynamic_pager >/dev/null; then
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.dynamic_pager.plist || true
        fi
        sysctl vm.swapusage || true

    - name: Show disk free (after)
      shell: bash
      run: df -h || true
