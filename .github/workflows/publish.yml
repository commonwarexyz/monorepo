name: Publish

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  All:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
    - name: Configure swap
      uses: ./.github/actions/swap
    - name: Run setup
      uses: ./.github/actions/setup
      with:
        sccache-r2-bucket: ${{ secrets.SCCACHE_R2_BUCKET }}
        sccache-r2-endpoint: ${{ secrets.SCCACHE_R2_ENDPOINT }}
        sccache-r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
        sccache-r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
    - name: Publish macros-impl
      run: ./.github/scripts/publish_crate.sh macros/impl/Cargo.toml
      if: ${{ !cancelled() }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    - name: Publish macros
      run: ./.github/scripts/publish_crate.sh macros/Cargo.toml
      if: ${{ !cancelled() }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    - name: Publish formatting
