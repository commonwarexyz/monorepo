name: Forge

on:
  push:
    branches: [ "main" ]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: forge-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  FOUNDRY_ISOLATE: "false"
  FORGE_SNAPSHOT_CHECK: "true"
  FORGE_SNAPSHOT_EMIT: "false"

jobs:
  Forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sol
    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: v1.8.3
    - name: Install Rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: stable
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
    - name: Check Solidity formatting
      run: forge fmt --check
    - name: Build Solidity contracts
      run: forge build --sizes --deny warnings
    - name: Test Solidity contracts
      run: forge test
    - name: Build fuzz input generator
      run: cargo build --release --locked -p commonware-sol-fuzz
    - name: Differential tests
      run: FOUNDRY_PROFILE=differential forge test --match-test 'test(Fuzz)?_Differential'
