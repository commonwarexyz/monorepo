name: Windows runtime

on:
  push:
    paths:
      - runtime/**
      - .github/workflows/windows-runtime.yml
  pull_request:
    paths:
      - runtime/**
      - .github/workflows/windows-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positioned-io:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check runtime library
        run: cargo +stable check -p commonware-runtime --lib
      - name: Lint runtime library
        run: cargo +stable clippy -p commonware-runtime --lib -- -D warnings
      - name: Exercise Windows positioned file operations
        run: |
          cargo +stable test -p commonware-runtime --lib storage::tokio::blob::windows_tests:: -- --nocapture
