name: Windows runtime

on:
  push:
    paths:
      - runtime/**
      - .github/workflows/windows-runtime.yml
  pull_request:
    paths:
      - runtime/**
      - .github/workflows/windows-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positioned-io:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Check runtime library
        run: cargo +1.99.1 check -p commonware-runtime --lib
      - name: Lint runtime library
        run: cargo +1.99.1 clippy -p commonware-runtime --lib -- -D warnings
      - name: Exercise Windows positioned file operations
        run: |
          cargo +1.99.1 test -p commonware-runtime --lib storage::tokio::blob::windows_tests:: -- --nocapture
