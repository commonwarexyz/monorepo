name: Auto Assign

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign-creator:
    name: Assign PR Creator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout swap action
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          sparse-checkout: .github/actions/swap
      - name: Configure swap
        uses: ./.github/actions/swap
      - name: Add PR creator as assignee
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-assignee "${{ github.event.pull_request.user.login }}"
