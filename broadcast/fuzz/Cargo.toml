[package]
name = "commonware-broadcast-fuzz"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata]
cargo-fuzz = true

[lints.cargo]
unused_dependencies = "allow"

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
commonware-broadcast = { path = ".." }
commonware-codec.workspace = true
commonware-cryptography = { workspace = true, features = ["arbitrary"] }
commonware-p2p.workspace = true
commonware-parallel.workspace = true
commonware-runtime.workspace = true
commonware-utils.workspace = true
futures.workspace = true
libfuzzer-sys.workspace = true
rand.workspace = true

[[bin]]
name = "broadcast_engine_operations"
path = "fuzz_targets/broadcast_engine_operations.rs"
test = false
doc = false
bench = false
