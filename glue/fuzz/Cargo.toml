[package]
name = "commonware-glue-fuzz"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true

[features]
default = [ "dkg-all", "stateful-all" ]
dkg-all = [
	"dkg-bootstrap",
	"dkg-bootstrap-restarts",
	"dkg-probe",
	"dkg-reshare",
	"dkg-reshare-restarts",
	"dkg-state-sync",
]
dkg-bootstrap = [ "dkg" ]
dkg-bootstrap-restarts = [ "dkg" ]
dkg-probe = [ "dkg" ]
dkg-reshare = [ "dkg" ]
dkg-reshare-restarts = [ "dkg" ]
dkg-state-sync = [ "dkg" ]
stateful-all = [
	"stateful-cert-mock-restarts",
	"stateful-cert-mock-restarts-db",
	"stateful-cert-mock-state-sync",
	"stateful-cert-mock-twins",
	"stateful-cert-mock-twins-coding",
	"stateful-db-sync",
	"stateful-probe",
]
mocks = [
	"commonware-consensus/mocks",
	"commonware-cryptography/mocks",
	"commonware-p2p/mocks",
	"commonware-resolver/mocks",
]
dkg = [ "mocks" ]
stateful-cert-mock-restarts = [ "mocks" ]
stateful-cert-mock-restarts-db = [ "mocks" ]
stateful-cert-mock-twins = [ "mocks" ]
stateful-cert-mock-twins-coding = [ "dep:commonware-coding", "mocks" ]
stateful-cert-mock-state-sync = [ "mocks" ]
stateful-db-sync = [ "mocks" ]
stateful-probe = [ "mocks" ]

[package.metadata]
cargo-fuzz = true

# `cargo fuzz` sets `--cfg fuzzing`; declare it so non-fuzz builds don't warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
arbitrary = { workspace = true, features = ["derive"] }
bytes.workspace = true
commonware-actor.workspace = true
commonware-broadcast.workspace = true
commonware-codec.workspace = true
commonware-coding = { workspace = true, optional = true }
commonware-consensus = { workspace = true, features = ["mocks"] }
commonware-cryptography = { workspace = true, features = ["mocks"] }
commonware-glue.workspace = true
commonware-macros.workspace = true
commonware-math.workspace = true
commonware-p2p = { workspace = true, features = ["mocks"] }
commonware-parallel = { workspace = true, features = ["test-utils"] }
commonware-resolver = { workspace = true, features = ["mocks"] }
commonware-runtime = { workspace = true, features = ["test-utils"] }
commonware-storage.workspace = true
commonware-utils = { workspace = true, features = ["arbitrary"] }
futures.workspace = true
governor.workspace = true
libfuzzer-sys.workspace = true
rand.workspace = true
rand_core.workspace = true
tracing.workspace = true

[[bin]]
name = "dkg_bootstrap"
path = "fuzz_targets/dkg_bootstrap.rs"
required-features = [ "dkg-bootstrap" ]
test = false
doc = false
bench = false

